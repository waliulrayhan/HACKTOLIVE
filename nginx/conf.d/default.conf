upstream frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream backend {
    server 127.0.0.1:4000;
    keepalive 32;
}

upstream n8n {
    server 127.0.0.1:5678;
    keepalive 32;
}

# Default localhost health endpoint for container probes
server {
    listen 80 default_server;
    server_name _;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "healthy\n";
    }

    location / {
        return 444;
    }
}

# ─── HTTP → HTTPS redirects ───────────────────────────────────────────────────

# hacktolive.net: redirect HTTP to HTTPS
server {
    listen 80;
    server_name hacktolive.net www.hacktolive.net;

    location / {
        return 301 https://hacktolive.net$request_uri;
    }
}

# api.hacktolive.net: redirect HTTP to HTTPS
server {
    listen 80;
    server_name api.hacktolive.net;

    location / {
        return 301 https://api.hacktolive.net$request_uri;
    }
}

# n8n.hacktolive.net: redirect HTTP to HTTPS
server {
    listen 80;
    server_name n8n.hacktolive.net;

    location / {
        return 301 https://n8n.hacktolive.net$request_uri;
    }
}

# mail.hacktolive.net: redirect HTTP to HTTPS
server {
    listen 80;
    server_name mail.hacktolive.net;

    location / {
        return 301 https://mail.hacktolive.net$request_uri;
    }
}

# academy.hacktolive.net: redirect legacy academy subdomain to canonical academy path
server {
    listen 80;
    server_name academy.hacktolive.net www.academy.hacktolive.net;

    location / {
        return 301 https://hacktolive.net/academy$request_uri;
    }
}

# hacktolive.io (all subdomains): redirect HTTP to hacktolive.net
server {
    listen 80;
    server_name hacktolive.io www.hacktolive.io api.hacktolive.io;

    # Health check endpoint (keep working during transition)
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://hacktolive.net$request_uri;
    }
}

# ─── HTTPS: hacktolive.io → hacktolive.net permanent redirect ─────────────────
# Requires the existing .io SSL cert so browsers don't show a security error
server {
    listen 443 ssl;
    http2 on;
    server_name hacktolive.io www.hacktolive.io;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    return 301 https://hacktolive.net$request_uri;
}

# ─── HTTPS: api.hacktolive.io → api.hacktolive.net permanent redirect ─────────
server {
    listen 443 ssl;
    http2 on;
    server_name api.hacktolive.io;

    ssl_certificate /etc/nginx/ssl/api-fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/api-privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    return 301 https://api.hacktolive.net$request_uri;
}

# ─── HTTPS: www.hacktolive.net → hacktolive.net (canonical) ──────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name www.hacktolive.net;

    ssl_certificate /etc/nginx/ssl/net-fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/net-privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    return 301 https://hacktolive.net$request_uri;
}

# ─── HTTPS: academy.hacktolive.net → hacktolive.net/academy (legacy) ─────────
server {
    listen 443 ssl;
    http2 on;
    server_name academy.hacktolive.net www.academy.hacktolive.net;

    ssl_certificate /etc/nginx/ssl/net-fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/net-privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    return 301 https://hacktolive.net/academy$request_uri;
}

# ─── HTTPS: Main Frontend — hacktolive.net ────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name hacktolive.net;

    ssl_certificate /etc/nginx/ssl/net-fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/net-privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 100M;

    # Force HTTPS in all future requests (HSTS)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Serve uploaded files directly (frontend pages reference /uploads/ via api subdomain
    # but also directly — handle both)
    location /uploads/ {
        root /var/www;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ─── HTTPS: API Backend — api.hacktolive.net ─────────────────────────────────
# The .net SSL cert is a SAN cert covering hacktolive.net + www + api subdomains
server {
    listen 443 ssl;
    http2 on;
    server_name api.hacktolive.net;

    ssl_certificate /etc/nginx/ssl/net-fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/net-privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 100M;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Serve uploaded files directly from nginx (faster, no backend needed)
    location /uploads/ {
        root /var/www;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    location / {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ─── HTTPS: n8n Automation — n8n.hacktolive.net ──────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name n8n.hacktolive.net;

    ssl_certificate /etc/nginx/ssl/n8n-fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/n8n-privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 100M;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://n8n;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        # n8n webhook/long-poll timeout
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# ─── HTTPS: Mail Server — mail.hacktolive.net ──────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name mail.hacktolive.net;

    ssl_certificate /etc/nginx/ssl/mail-fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/mail-privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 100M;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        return 200 "Mail server placeholder - SMTP/IMAP via external provider\n";
        add_header Content-Type text/plain;
    }
}
